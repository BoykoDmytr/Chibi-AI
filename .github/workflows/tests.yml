name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests tools
      - name: Tests
        # On windows-latest this also runs the Windows-only tests (ctypes
        # signatures, foreground/idle queries) against the real Win32 API.
        run: python -m pytest -q
      - name: Native-window tests (Windows)
        # Real HWNDs need Qt's "windows" platform instead of "offscreen".
        # Runs even if the main test step failed: it proves different things.
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        env:
          QT_QPA_PLATFORM: windows
        run: python -m pytest -q tests/desktop/test_platform_win.py tests/vision/test_capture_win.py
